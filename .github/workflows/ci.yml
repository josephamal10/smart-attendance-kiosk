# Runs on every push and pull request: backend tests + Flutter analysis and tests.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret
      DISABLE_SCHEDULER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries for OpenCV / MediaPipe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Cache face models (downloaded on first run)
        uses: actions/cache@v4
        with:
          path: models/face
          key: face-models-yunet2023mar-sface2021dec
      - name: Test
        run: pytest -q

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technerdz_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
