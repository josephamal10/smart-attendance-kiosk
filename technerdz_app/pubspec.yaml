name: technerdz_app
description: NanoNino Attendance — face recognition kiosk
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  intl: ^0.19.0
  camera: ^0.10.5
  camera_windows: ^0.2.6+4
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.6
  qr_flutter: ^4.1.0      # QR code to download "My report" on a phone
  web: ^1.1.0             # browser downloads in the web admin dashboard
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # Inter (SIL Open Font License, assets/fonts/OFL.txt) bundled so the kiosk works offline
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700